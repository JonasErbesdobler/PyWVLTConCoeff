[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "PyWVLTConCoeff"
version = "0.1.0"
dependencies = [
  "numpy>=2.0.0",
  "matplotlib>=3.8.0",
  "pywavelets>=1.4.1"
]
requires-python = ">=3.9"
authors = [
  {name = "Jonas A. Erbesdobler", email = "erbesdobler@g.ecc.u-tokyo.ac.jp"}
]
maintainers = [
  {name = "Jonas A. Erbesdobler", email = "erbesdobler@g.ecc.u-tokyo.ac.jp"}
]
description = "A Python package for calculating up to four-term wavelet connection coefficients on an infinite domain."
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
keywords = ["wavelets", "daubechies", "connection coefficients", "wavelet-galerkin", "numerical methods", "python"]
classifiers = [
  "Development Status :: 4 - Beta",

  # Specify the Python versions you support here.
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest"
]

[project.urls]
# Homepage = """
# Documentation = ""
Repository = "https://github.com/JonasErbesdobler/PyWVLTConCoeff"
# "Bug Tracker" = ""
# Changelog = ""

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# You can add other rules here if you want

[tool.ruff.per-file-ignores]
"PyWVLTConCoeff/__init__.py" = ["F403"]